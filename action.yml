name: "Cursor Review Action"
description: "Reusable Cursor CLI powered PR review action with commands, repo config, diff filtering, and persistent comments"
author: "nanyang12138"

branding:
  icon: "message-square"
  color: "blue"

inputs:
  cursor-api-key:
    description: "Cursor API key. Pass from secrets.CURSOR_API_KEY."
    required: true
  github-token:
    description: "GitHub token used to create or update PR comments. Pass github.token."
    required: false
    default: ""
  base-sha:
    description: "Base SHA for PR diff."
    required: false
    default: ""
  head-sha:
    description: "Head SHA for PR diff."
    required: false
    default: ""
  pr-number:
    description: "Pull request number. Required when comment-mode is not off."
    required: false
    default: ""
  pr-title:
    description: "Pull request title for review context."
    required: false
    default: ""
  pr-body:
    description: "Pull request body for review context."
    required: false
    default: ""
  base-ref:
    description: "Base branch name for review context."
    required: false
    default: ""
  head-ref:
    description: "Head branch name for review context."
    required: false
    default: ""
  pr-is-fork:
    description: "Whether the pull request head repository is a fork. Pass github.event.pull_request.head.repo.fork when available."
    required: false
    default: ""
  comment-author-association:
    description: "GitHub author association for issue_comment slash commands."
    required: false
    default: ""
  trusted-author-associations:
    description: "Comma-separated author associations allowed to run issue_comment slash commands."
    required: false
    default: "OWNER,MEMBER,COLLABORATOR"
  commit-messages:
    description: "Newline-separated commit messages for review context."
    required: false
    default: ""
  event-name:
    description: "GitHub event name, usually github.event_name."
    required: false
    default: ""
  comment-body:
    description: "PR comment body for command trigger, usually github.event.comment.body."
    required: false
    default: ""
  user-prompt:
    description: "Extra user instructions. Overrides command text extracted from comment-body."
    required: false
    default: ""
  trigger-phrase:
    description: "Manual review trigger phrase."
    required: false
    default: "/cursor-review"
  command:
    description: "Command to run: review, ask, improve, or describe."
    required: false
    default: "review"
  enabled-commands:
    description: "Comma-separated enabled commands."
    required: false
    default: "review"
  config-path:
    description: "Repo-local config file path."
    required: false
    default: ".cursor-review.yml"
  model:
    description: "Cursor model. Use auto unless you know the account supports a specific model."
    required: false
    default: "auto"
  language:
    description: "Output language."
    required: false
    default: "zh-CN"
  review-focus:
    description: "Comma-separated review focus list."
    required: false
    default: "correctness,security,performance,tests,edge-cases"
  max-findings:
    description: "Maximum actionable findings to return."
    required: false
    default: "5"
  max-diff-bytes:
    description: "Maximum diff bytes sent to Cursor."
    required: false
    default: "120000"
  max-files:
    description: "Maximum changed files to include in the selected diff. Use 0 for unlimited."
    required: false
    default: "0"
  max-hunks:
    description: "Maximum diff hunks to include in the selected diff. Use 0 for unlimited."
    required: false
    default: "0"
  max-cursor-calls:
    description: "Maximum Cursor CLI calls allowed for one action run. Current engine defaults to one call."
    required: false
    default: "1"
  timeout-seconds:
    description: "Per Cursor CLI call timeout in seconds."
    required: false
    default: "600"
  filter-mode:
    description: "Diff filter mode: added, diff_context, file."
    required: false
    default: "added"
  include-patterns:
    description: "Comma-separated file globs to include."
    required: false
    default: ""
  exclude-patterns:
    description: "Comma-separated file globs to exclude."
    required: false
    default: ""
  persistent-comment:
    description: "Update the previous Cursor Review comment instead of creating a new one."
    required: false
    default: "true"
  comment-mode:
    description: "Comment mode: update, create, or off."
    required: false
    default: "update"
  fail-on-error:
    description: "Fail the workflow if Cursor review fails."
    required: false
    default: "false"
  fail-on-findings:
    description: "Fail the workflow when high severity findings are found. Reserved for future use."
    required: false
    default: "false"
  install-cursor:
    description: "Install Cursor CLI before running review."
    required: false
    default: "true"

outputs:
  summary:
    description: "Rendered PR review markdown."
    value: ${{ steps.review.outputs.summary }}
  findings-json:
    description: "Structured findings JSON when available."
    value: ${{ steps.review.outputs.findings_json }}
  exit-code:
    description: "Cursor agent exit code."
    value: ${{ steps.review.outputs.exit_code }}
  diff-truncated:
    description: "Whether the diff was truncated."
    value: ${{ steps.review.outputs.diff_truncated }}
  resolved-command:
    description: "Resolved command: review, ask, improve, or describe."
    value: ${{ steps.review.outputs.resolved_command }}
  should-comment:
    description: "Whether the action should publish a PR comment for this run."
    value: ${{ steps.review.outputs.should_comment }}
  comment-url:
    description: "Created or updated PR comment URL."
    value: ${{ steps.comment.outputs.comment_url }}

runs:
  using: "composite"
  steps:
    - name: Install Cursor CLI
      if: ${{ inputs.install-cursor == 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-cursor.sh"

    - name: Run Cursor review
      id: review
      shell: bash
      env:
        CURSOR_API_KEY: ${{ inputs.cursor-api-key }}
        INPUT_BASE_SHA: ${{ inputs.base-sha }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
        INPUT_PR_BODY: ${{ inputs.pr-body }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_PR_IS_FORK: ${{ inputs.pr-is-fork }}
        INPUT_COMMENT_AUTHOR_ASSOCIATION: ${{ inputs.comment-author-association }}
        INPUT_TRUSTED_AUTHOR_ASSOCIATIONS: ${{ inputs.trusted-author-associations }}
        INPUT_COMMIT_MESSAGES: ${{ inputs.commit-messages }}
        INPUT_EVENT_NAME: ${{ inputs.event-name }}
        INPUT_COMMENT_BODY: ${{ inputs.comment-body }}
        INPUT_USER_PROMPT: ${{ inputs.user-prompt }}
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ENABLED_COMMANDS: ${{ inputs.enabled-commands }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_REVIEW_FOCUS: ${{ inputs.review-focus }}
        INPUT_MAX_FINDINGS: ${{ inputs.max-findings }}
        INPUT_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_MAX_HUNKS: ${{ inputs.max-hunks }}
        INPUT_MAX_CURSOR_CALLS: ${{ inputs.max-cursor-calls }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_FILTER_MODE: ${{ inputs.filter-mode }}
        INPUT_INCLUDE_PATTERNS: ${{ inputs.include-patterns }}
        INPUT_EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/cursor_review.py"

    - name: Create or update PR comment
      id: comment
      if: ${{ steps.review.outputs.should_comment != 'false' && inputs.comment-mode != 'off' && inputs.pr-number != '' && inputs.github-token != '' }}
      uses: actions/github-script@v7
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        REVIEW_BODY: ${{ steps.review.outputs.summary }}
        RESOLVED_COMMAND: ${{ steps.review.outputs.resolved_command }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PERSISTENT_COMMENT: ${{ inputs.persistent-comment }}
        COMMENT_MODE: ${{ inputs.comment-mode }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const rawCommand = process.env.RESOLVED_COMMAND || 'review';
          const command = rawCommand.toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'review';
          const marker = `<!-- cursor-review-action:${command} -->`;
          const titles = {
            review: 'Cursor Review',
            ask: 'Cursor Ask',
            improve: 'Cursor Improve',
            describe: 'Cursor Describe'
          };
          const prNumber = Number(process.env.PR_NUMBER);
          const reviewBody = process.env.REVIEW_BODY || 'Cursor review produced no output.';
          const body = `${marker}\n## ${titles[command] || `Cursor ${command}`}\n\n${reviewBody}`;
          const persistent = process.env.PERSISTENT_COMMENT === 'true' || process.env.COMMENT_MODE === 'update';

          let comment = null;
          if (persistent) {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            comment = comments
              .filter((item) => item.user && item.user.type === 'Bot')
              .reverse()
              .find((item) => item.body && item.body.includes(marker));
          }

          let result;
          if (comment) {
            result = await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body
            });
          } else {
            result = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
          }

          core.setOutput('comment_url', result.data.html_url || '');
